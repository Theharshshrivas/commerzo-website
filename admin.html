<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font:15px/1.5 system-ui,sans-serif}
header{background:#101827;color:#fff;padding:14px 17px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}

main{max-width:1120px;margin:22px auto;padding:0 13px}.card{background:#fff;border:1px solid #e2e7f0;border-radius:15px;padding:17px;margin-bottom:14px;box-shadow:0 5px 20px #18213b08}
h1{font-size:24px;margin:0 0 5px}h2{font-size:19px;margin:17px 0 9px}h3{font-size:16px;margin:0 0 8px}p{color:#657087}
label{display:block;font-size:13px;font-weight:700;color:#526078;margin:11px 0 5px}
input,select,textarea{width:100%;min-width:0;padding:10px 11px;border:1px solid #cbd2df;border-radius:10px;font:inherit;background:#fff;color:#172033}
textarea{min-height:78px;resize:vertical}input[type=file]{padding:8px}
button{padding:10px 13px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#5145e5;color:#fff}.secondary{background:#edf0f7;color:#172033}.danger{background:#fee2e2;color:#991b1b}.outline{background:#fff;border:1px solid #d9d5ff;color:#5145e5}
.hidden{display:none!important}.muted,.small,.help{font-size:13px;color:#657087;overflow-wrap:anywhere}.status{margin-top:9px;min-height:21px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
.metric{background:#f7f8fc;padding:12px;border-radius:11px}.metric strong{display:block;font-size:24px}
.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.tab{background:#edf0f7;color:#172033}.tab.active{background:#5145e5;color:#fff}
.entry{border:1px solid #e2e7f0;border-radius:11px;padding:12px;margin:9px 0;overflow-wrap:anywhere}.entryhead{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}
.filters,.formgrid,.optiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 11px}
.filters{grid-template-columns:repeat(4,minmax(0,1fr));background:#f8f9fc;border-radius:11px;padding:11px;margin:12px 0}
.full{grid-column:1/-1}.pill{display:inline-block;background:#eeedff;color:#4034c9;padding:3px 8px;border-radius:30px;font-size:11px}
.draft{background:#fff3cd;color:#765600}.published{background:#dcfce7;color:#166534}
.notice{background:#fff5d8;color:#694e00;padding:11px;border-radius:10px;font-size:13px;margin:10px 0}
.batchbar{position:sticky;bottom:5px;background:#ffffffed;border:1px solid #e2e7f0;padding:10px;border-radius:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;backdrop-filter:blur(8px);z-index:3}
@media(max-width:680px){main{padding:0 9px}.card{padding:13px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.filters,.formgrid,.optiongrid,.grid{grid-template-columns:1fr}.full{grid-column:auto}.tab{flex:1 1 38%}.batchbar{position:sticky;bottom:4px}}
</style></head>
<body>

<main>

<div id="filters"></div><div id="editor"></div><div id="contentStatus" class="status" role="status"></div><h2 id="listTitle">Saved content</h2><div id="entries"></div></div>
</section></main>
<script type="module">

const firebaseConfig={apiKey:"AIzaSyC8UomLked7cPRjfD2yHBBTlCAeCd-53cM",authDomain:"commerzo-42fd2.firebaseapp.com",projectId:"commerzo-42fd2",storageBucket:"commerzo-42fd2.firebasestorage.app",messagingSenderId:"472656083923",appId:"1:472656083923:web:022b77078ec9e07db00d26",measurementId:"G-RCHSTFTQM2"};
const MEDIA_ENDPOINT="https://rawnsqcovqckwreuegpz.supabase.co/functions/v1/super-action",MAX_SIZE=20*1024*1024,ALLOWED=new Set(["application/pdf","image/jpeg","image/png","image/webp","video/mp4"]);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const sections=["subjects","chapters","mcqs","resources"],cache={subjects:[],chapters:[],mcqs:[],resources:[]};
let active="subjects",verifiedUid=null,authRun=0,editId=null,batchQueue=[],batchIds={};
const cfg={
subjects:{title:"Subjects",help:"Create MP Board, CBSE or shared subjects.",fields:[["name","Subject name","text",1],["board","Board","select",1,["MP Board","CBSE","Both"]],["className","Class","select",1,["11","12","11 and 12"]],["code","Subject code","text"],["description","Description","textarea"]]},
chapters:{title:"Chapters",help:"Select a subject to see its chapters grouped correctly.",fields:[["name","Chapter name","text",1],["subjectId","Subject","subject",1],["board","Board","select",1,["MP Board","CBSE","Both"]],["className","Class","select",1,["11","12"]],["order","Chapter number / order","number",1],["description","Description","textarea"]]},
resources:{title:"Study Resources",help:"Existing Supabase private upload flow is retained.",fields:[["title","Resource title","text",1],["type","Resource type","select",1,["Handwritten Notes","Previous Year Papers","Marking Scheme","Sample Papers","Important Questions","Syllabus","Other"]],["subjectId","Subject","subject"],["chapterId","Chapter","chapter"],["board","Board","select",1,["MP Board","CBSE","Both"]],["className","Class","select",1,["11","12","11 and 12"]],["url","Existing URL","url"],["file","Upload file","file"],["description","Description","textarea"]]}
};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const titleOf=r=>r.name||r.title||r.question||"Untitled";
function setStatus(t){$("contentStatus").textContent=t}
function boardOK(item,b){return !b||!item.board||item.board==="Both"||item.board===b}
function classOK(item,c){return !c||!item.className||["11 and 12","11 & 12","both"].includes(String(item.className).toLowerCase())||String(item.className)===c}
function subjectItems(board,cls){return cache.subjects.filter(x=>boardOK(x,board)&&classOK(x,cls))}
function chapterItems(subjectId,board,cls){return cache.chapters.filter(x=>(!subjectId||x.subjectId===subjectId)&&boardOK(x,board)&&classOK(x,cls))}
function fieldHTML(f,val=""){let[id,label,type,req,opts]=f,control="";
if(type==="select")control=`<select id="f_${id}" ${req?"required":""}><option value="">Choose…</option>${opts.map(v=>`<option ${v===val?"selected":""}>${esc(v)}</option>`).join("")}</select>`;
else if(type==="subject"||type==="chapter"){let arr=type==="subject"?cache.subjects:cache.chapters;control=`<select id="f_${id}" ${req?"required":""}><option value="">Choose…</option>${arr.map(x=>`<option value="${esc(x.id)}" ${x.id===val?"selected":""}>${esc(titleOf(x))}</option>`).join("")}</select>`}
else if(type==="textarea")control=`<textarea id="f_${id}">${esc(val)}</textarea>`;
else if(type==="file")control=`<input id="f_file" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.mp4,application/pdf,image/jpeg,image/png,image/webp,video/mp4"><div class="help" id="currentFile"></div>`;
else control=`<input id="f_${id}" type="${type}" ${req?"required":""} value="${esc(val)}">`;
return `<div class="${["description","question"].includes(id)?"full":""}"><label>${label}${req?" *":""}</label>${control}</div>`}
function renderFilters(){if(active==="subjects"){$("filters").innerHTML="";return}
let b=$("filterBoard")?.value||"",cl=$("filterClass")?.value||"",s=$("filterSubject")?.value||"",ch=$("filterChapter")?.value||"";
$("filters").innerHTML=`<div class="filters"><div><label>Board</label><select id="filterBoard"><option value="">All boards</option><option>MP Board</option><option>CBSE</option></select></div><div><label>Class</label><select id="filterClass"><option value="">All classes</option><option>11</option><option>12</option></select></div><div><label>Subject</label><select id="filterSubject"><option value="">All subjects</option>${subjectItems(b,cl).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></div><div><label>Chapter</label><select id="filterChapter"><option value="">All chapters</option>${chapterItems(s,b,cl).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></div></div>`;
$("filterBoard").value=b;$("filterClass").value=cl;$("filterSubject").value=s;$("filterChapter").value=ch;
["filterBoard","filterClass","filterSubject","filterChapter"].forEach(id=>$(id).onchange=()=>{let nb=$("filterBoard").value,nc=$("filterClass").value,ns=$("filterSubject").value;let keep=id==="filterChapter"?$("filterChapter").value:"";if(id!=="filterChapter"){$("filters").dataset.subject=ns;$("filters").dataset.chapter=""}renderFilters();if(id!=="filterChapter"){$("filterSubject").value=ns;$("filterChapter").value=""}else $("filterChapter").value=keep;renderEntries()})}
function renderEditor(){if(active==="mcqs"){renderBatchEditor();return}let c=cfg[active];$("editor").innerHTML=`<form id="contentForm" class="card"><h3>${editId?"Edit":"Add"} ${active==="resources"?"resource":active.slice(0,-1)}</h3><div class="formgrid">${c.fields.map(f=>fieldHTML(f)).join("")}</div><div class="actions"><button class="primary">${editId?"Save changes":"Save "+active.slice(0,-1)}</button><button type="button" class="secondary" id="cancelEdit">Cancel</button></div></form>`;
$("cancelEdit").onclick=()=>{editId=null;renderManager()};$("contentForm").onsubmit=saveStandard;
if(active==="resources" )$("f_subjectId")?.addEventListener("change",()=>{let s=$("f_subjectId").value,sel=$("f_chapterId");if(sel)sel.innerHTML='<option value="">— None —</option>'+chapterItems(s,"","").map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")});
}
function renderBatchEditor(){let s=batchSettings();let subs=subjectItems(s.board,s.className),chs=chapterItems(s.subjectId,s.board,s.className);
$("editor").innerHTML=`<section class="card"><h3>① Batch setup</h3><div class="formgrid"><div><label>Board</label><select id="bBoard"><option ${s.board==="MP Board"?"selected":""}>MP Board</option><option ${s.board==="CBSE"?"selected":""}>CBSE</option></select></div><div><label>Class</label><select id="bClass"><option value="11" ${s.className==="11"?"selected":""}>11</option><option value="12" ${s.className==="12"?"selected":""}>12</option></select></div><div><label>Subject</label><select id="bSubject"><option value="">Choose subject</option>${subs.map(x=>`<option value="${esc(x.id)}" ${x.id===s.subjectId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div><label>Chapter</label><select id="bChapter"><option value="">Choose chapter</option>${chs.map(x=>`<option value="${esc(x.id)}" ${x.id===s.chapterId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div><label>Default difficulty</label><select id="bDifficulty"><option>Easy</option><option ${s.difficulty==="Medium"?"selected":""}>Medium</option><option ${s.difficulty==="Hard"?"selected":""}>Hard</option></select></div></div><p class="help">Set these once. Each added question keeps the same board, class, subject and chapter.</p></section>
<section class="card"><h3>② Fast MCQ entry</h3><form id="mcqForm"><label>Question *</label><textarea id="qQuestion" required></textarea><div class="optiongrid"><div><label>Option A *</label><input id="qA" required></div><div><label>Option B *</label><input id="qB" required></div><div><label>Option C *</label><input id="qC" required></div><div><label>Option D *</label><input id="qD" required></div></div><div class="formgrid"><div><label>Correct answer *</label><select id="qCorrect" required><option value="">Choose</option><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div><label>Difficulty</label><select id="qDifficulty"><option value="">Use batch default</option><option>Easy</option><option>Medium</option><option>Hard</option></select></div><div class="full"><label>Explanation (optional)</label><textarea id="qExplanation"></textarea></div></div><button class="primary" type="submit">Save & Add Next</button></form><div id="batchStatus" class="status"></div></section>
<section class="card"><div class="entryhead"><div><h3>③ Batch review</h3><div class="muted">Review before saving as drafts or publishing.</div></div><span class="pill" id="queueCount">${batchQueue.length} queued</span></div><div id="queueList"></div><div class="batchbar"><strong id="queueSummary">${batchQueue.length} ready</strong><div class="actions"><button class="secondary" id="clearQueue">Clear</button><button class="outline" id="saveDrafts">Save drafts</button><button class="primary" id="publishQueue">Publish batch</button></div></div></section>`;
["bBoard","bClass","bSubject"].forEach(id=>$(id).onchange=()=>{let s=batchSettings();s.board=$("bBoard").value;s.className=$("bClass").value;s.subjectId=$("bSubject").value;s.chapterId="";renderBatchEditor()});
$("bChapter").onchange=()=>batchSettings().chapterId=$("bChapter").value;$("bDifficulty").onchange=()=>batchSettings().difficulty=$("bDifficulty").value;
$("mcqForm").onsubmit=e=>{e.preventDefault();queueMCQ()};$("clearQueue").onclick=()=>{if(confirm("Clear the current unsaved review queue?")){batchQueue=[];renderQueue()}};
$("saveDrafts").onclick=()=>persistQueue("draft");$("publishQueue").onclick=()=>persistQueue("published");renderQueue()}
let settings={board:"MP Board",className:"12",subjectId:"",chapterId:"",difficulty:"Medium"};function batchSettings(){return settings}
function queueMCQ(){let s=batchSettings(),q=$("qQuestion").value.trim(),options=[$("qA").value.trim(),$("qB").value.trim(),$("qC").value.trim(),$("qD").value.trim()],ci=$("qCorrect").value;if(!s.subjectId||!s.chapterId){$("batchStatus").textContent="Select subject and chapter first.";return}if(!q||options.some(x=>!x)||ci===""){$("batchStatus").textContent="Complete the question, all options and correct answer.";return}
batchQueue.push({question:q,options,correctIndex:Number(ci),explanation:$("qExplanation").value.trim(),difficulty:$("qDifficulty").value||s.difficulty,subjectId:s.subjectId,chapterId:s.chapterId,board:s.board,className:s.className,status:"draft"});$("mcqForm").reset();$("batchStatus").textContent="Added to review. Batch settings retained.";renderQueue()}
function renderQueue(){if(!$("queueList"))return;$("queueCount").textContent=batchQueue.length+" queued";$("queueSummary").textContent=batchQueue.length+" MCQs ready";$("queueList").innerHTML=batchQueue.length?batchQueue.map((q,i)=>`<article class="entry"><div class="entryhead"><strong>${i+1}. ${esc(q.question)}</strong><button class="danger" data-remove="${i}">Remove</button></div><div class="small">${esc(q.board)} · Class ${esc(q.className)} · ${esc(cache.subjects.find(x=>x.id===q.subjectId)?.name||"")} · ${esc(cache.chapters.find(x=>x.id===q.chapterId)?.name||"")} · Correct ${"ABCD"[q.correctIndex]}</div></article>`).join(""):'<p class="muted">No questions queued.</p>';document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{batchQueue.splice(Number(b.dataset.remove),1);renderQueue()})}
async function persistQueue(state){if(!batchQueue.length){$("batchStatus").textContent="Queue at least one MCQ first.";return}if(!confirm(`${state==="draft"?"Save":"Publish"} ${batchQueue.length} MCQs?`))return;const buttons=[$("saveDrafts"),$("publishQueue")];buttons.forEach(b=>b.disabled=true);try{
let docs=batchQueue.map(q=>{if(!q._id)q._id=doc(collection(db,"mcqs")).id;return q});
for(let start=0;start<docs.length;start+=400){let wb=writeBatch(db);for(const q of docs.slice(start,start+400)){let data={...q,status:state,createdBy:verifiedUid,updatedAt:serverTimestamp()};delete data._id;wb.set(doc(db,"mcqs",q._id),data,{merge:true})}await wb.commit()}
$("batchStatus").textContent=`${docs.length} MCQs ${state==="draft"?"saved as drafts":"published"}.`;batchQueue=[];await refreshAll();renderBatchEditor()
}catch(e){console.error(e);$("batchStatus").textContent="Save failed: "+(e.message||e.code)+". Retry uses the same generated document IDs, preventing duplicate documents."}finally{buttons.forEach(b=>b.disabled=false)}}
function currentList(){let arr=cache[active];if(active==="subjects")return arr;let b=$("filterBoard")?.value||"",cl=$("filterClass")?.value||"",s=$("filterSubject")?.value||"",ch=$("filterChapter")?.value||"";return arr.filter(x=>boardOK(x,b)&&classOK(x,cl)&&(!s||x.subjectId===s)&&(!ch||x.chapterId===ch))}
function renderEntries(){let arr=currentList();if(active==="chapters"||active==="mcqs"){let key=active==="chapters"?"subjectId":"chapterId",groups={};arr.forEach(x=>(groups[x[key]||"unlinked"]??=[]).push(x));$("entries").innerHTML=arr.length?Object.entries(groups).map(([id,items])=>{let p=active==="chapters"?cache.subjects.find(x=>x.id===id):cache.chapters.find(x=>x.id===id);return `<section class="card"><h3>${esc(p?.name||"Unlinked")} <span class="pill">${items.length}</span></h3>${items.map(entryHTML).join("")}</section>`}).join(""):'<p class="muted">No matching records.</p>'}else $("entries").innerHTML=arr.length?arr.map(entryHTML).join(""):'<p class="muted">No records saved.</p>';
$("entries").querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editItem(b.dataset.edit));$("entries").querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removeItem(b.dataset.delete));$("entries").querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>changeMCQState(b.dataset.state,b.dataset.value))}
function entryHTML(r){let meta=active==="chapters"?`${cache.subjects.find(x=>x.id===r.subjectId)?.name||"Subject missing"} · ${r.board||""} · Class ${r.className||""}`:active==="mcqs"?`${cache.subjects.find(x=>x.id===r.subjectId)?.name||"Subject missing"} · ${cache.chapters.find(x=>x.id===r.chapterId)?.name||"Chapter missing"} · ${r.board||""} · Correct ${"ABCD"[Number(r.correctIndex)]||"?"}`:active==="resources"?`${r.type||""} · ${r.board||""} · ${r.storagePath?"Private file":r.url?"URL":"No file"}`:`${r.board||""} · Class ${r.className||""}`;
return `<article class="entry"><div class="entryhead"><strong>${esc(titleOf(r))}</strong>${active==="mcqs"?`<span class="pill ${r.status==="draft"?"draft":"published"}">${r.status||"legacy published"}</span>`:""}</div><div class="small">${esc(meta)}</div>${active==="mcqs"?`<div class="small">${esc((r.options||[]).map((o,i)=>"("+ "ABCD"[i]+") "+o).join(" · "))}</div>`:""}<div class="actions">${active==="mcqs"?`<button class="${r.status==="published"?"secondary":"primary"}" data-state="${esc(r.id)}" data-value="${r.status==="published"?"draft":"published"}">${r.status==="published"?"Move to draft":"Publish"}</button>`:""}<button class="secondary" data-edit="${esc(r.id)}">Edit</button><button class="danger" data-delete="${esc(r.id)}">Delete</button></div></article>`}
async function changeMCQState(id,value){try{await updateDoc(doc(db,"mcqs",id),{status:value,updatedAt:serverTimestamp()});setStatus(value==="published"?"Published.":"Moved to draft.");await refreshAll()}catch(e){setStatus("Status update failed: "+(e.message||e.code))}}
async function editItem(id){let r=cache[active].find(x=>x.id===id);if(!r)return;editId=id;if(active==="mcqs"){renderMCQEdit(r);return}renderEditor();for(let f of cfg[active].fields){if(f[0]==="file")continue;let el=$("f_"+f[0]);if(el)el.value=r[f[0]]??""}if(active==="resources"&&$("currentFile"))$("currentFile").textContent=r.fileName?"Existing private file: "+r.fileName:"";window.scrollTo({top:0,behavior:"smooth"})}
function renderMCQEdit(r){$("editor").innerHTML=`<form id="mcqEditForm" class="card"><h3>Edit MCQ</h3><label>Question</label><textarea id="eQuestion" required>${esc(r.question)}</textarea><div class="optiongrid">${(r.options||["","","",""]).map((x,i)=>`<div><label>Option ${"ABCD"[i]}</label><input id="eOpt${i}" value="${esc(x)}" required></div>`).join("")}</div><div class="formgrid"><div><label>Correct answer</label><select id="eCorrect">${["A","B","C","D"].map((x,i)=>`<option value="${i}" ${Number(r.correctIndex)===i?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Difficulty</label><select id="eDifficulty">${["Easy","Medium","Hard"].map(x=>`<option ${r.difficulty===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="full"><label>Explanation</label><textarea id="eExplanation">${esc(r.explanation||"")}</textarea></div></div><div class="actions"><button class="primary">Save MCQ</button><button type="button" class="secondary" id="cancelMCQEdit">Cancel</button></div></form>`;$("cancelMCQEdit").onclick=()=>{editId=null;renderManager()};$("mcqEditForm").onsubmit=async e=>{e.preventDefault();try{let data={question:$("eQuestion").value.trim(),options:[0,1,2,3].map(i=>$("eOpt"+i).value.trim()),correctIndex:Number($("eCorrect").value),difficulty:$("eDifficulty").value,explanation:$("eExplanation").value.trim(),updatedAt:serverTimestamp()};await updateDoc(doc(db,"mcqs",id),data);editId=null;setStatus("MCQ updated.");await refreshAll()}catch(err){setStatus("Update failed: "+(err.message||err.code))}}}
async function saveStandard(e){e.preventDefault();let data={},fields=cfg[active].fields;for(let f of fields){let[id,label,type]=f;if(type==="file")continue;let v=$("f_"+id)?.value?.trim()??"";if(type==="number")v=v===""?null:Number(v);if(v!==""&&v!==null)data[id]=v}
let file=active==="resources"?$("f_file").files?.[0]:null;if(active==="resources"){if(!file&&!data.url&&!editId){setStatus("Provide a URL or upload a file.");return}if(data.url&&!/^https?:\\/\\//i.test(data.url)){setStatus("URL must start with http:// or https://.");return}}
try{if(active==="resources"&&file){if(file.size<1||file.size>MAX_SIZE||!ALLOWED.has(file.type))throw Error("Use PDF/JPG/PNG/WEBP/MP4 up to 20 MiB.");let token=await auth.currentUser.getIdToken(true),fd=new FormData();fd.append("file",file,file.name);let res=await fetch(MEDIA_ENDPOINT,{method:"POST",headers:{Authorization:"Bearer "+token},body:fd}),up=await res.json().catch(()=>({}));if(!res.ok||!up.ok||!up.storagePath)throw Error(up.error||"Upload failed");Object.assign(data,{storagePath:up.storagePath,fileName:up.fileName||file.name,fileType:up.fileType||file.type,fileSize:up.fileSize||file.size,uploadedBy:up.uploadedBy||verifiedUid,storageProvider:"supabase"})}else if(active==="resources"&&editId){let old=cache.resources.find(x=>x.id===editId);if(old?.storagePath)for(let k of ["storagePath","fileName","fileType","fileSize","uploadedBy","storageProvider"])data[k]=old[k]}
if(active==="resources"&&!data.url)delete data.url;if(active==="resources"&&!data.url&&!data.storagePath)throw Error("Resource requires URL or uploaded file.");
data.updatedAt=serverTimestamp();if(editId)await updateDoc(doc(db,active,editId),data);else{data.createdAt=serverTimestamp();await addDoc(collection(db,active),data)}editId=null;setStatus("Saved successfully.");await refreshAll()}catch(err){console.error(err);setStatus("Save failed: "+(err.message||err.code))}}
async function removeItem(id){let r=cache[active].find(x=>x.id===id);if(!r||!confirm(`Delete "${titleOf(r)}" from Firestore? This cannot be undone. Stored file will not be deleted automatically.`))return;try{await deleteDoc(doc(db,active,id));setStatus("Deleted.");await refreshAll()}catch(e){setStatus("Delete failed: "+(e.message||e.code))}}
async function refreshAll(){ $("mainStatus").textContent="Loading Firestore…";try{for(let s of sections){let snap=await getDocs(collection(db,s));cache[s]=snap.docs.map(d=>({id:d.id,...d.data()}))}for(let id of ["subjectCount","chapterCount","mcqCount","resourceCount"])$(id).textContent=cache[id.replace("Count","")].length;$("mainStatus").textContent="Connected. Existing records preserved.";renderManager()}catch(e){console.error(e);$("mainStatus").textContent="Load failed: "+(e.message||e.code)}}
function renderManager(){$("sectionTitle").textContent=active==="mcqs"?"MCQ Studio":cfg[active].title;$("sectionHelp").textContent=active==="mcqs"?"Batch setup once, add questions quickly, review, then save or publish.":cfg[active].help;$("listTitle").textContent=active==="chapters"?"Chapters grouped by subject":active==="mcqs"?"MCQs grouped by chapter":"Saved "+active;$("filters").innerHTML="";renderFilters();renderEditor();renderEntries()}
function switchSection(s){active=s;editId=null;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.section===s));setStatus("");renderManager()}
onAuthStateChanged(auth,async user=>{let run=++authRun;$("dashboard").classList.add("hidden");if(!user){verifiedUid=null;$("loginPanel").classList.remove("hidden");return}$("loginPanel").classList.add("hidden");try{let snap=await getDoc(doc(db,"admins",user.uid));if(run!==authRun)return;if(!snap.exists()||snap.data().role!=="admin"){await signOut(auth);$("loginPanel").classList.remove("hidden");$("loginStatus").textContent="Access denied: admin role not found.";return}verifiedUid=user.uid;$("account").textContent="Admin: "+(user.email||user.uid);$("dashboard").classList.remove("hidden");await refreshAll()}catch(e){console.error(e);await signOut(auth).catch(()=>{});$("loginPanel").classList.remove("hidden");$("loginStatus").textContent="Admin verification failed: "+(e.message||e.code)}});
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginButton").disabled=true;try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(err){$("loginStatus").textContent=err.message||err.code}finally{$("loginButton").disabled=false}};
$("logoutButton").onclick=()=>signOut(auth);$("refreshButton").onclick=refreshAll;document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchSection(b.dataset.section));
</script></body></html>
