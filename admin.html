<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101827">
<title>COMMERZO | Admin 2.0</title>
<link rel="icon" href="./commerzo-logo.png">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fb;color:#172033;font:15px/1.5 system-ui,sans-serif}
header{background:#101827;color:#fff;padding:14px 17px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:9px;padding:3px}
main{max-width:1120px;margin:22px auto;padding:0 13px}
.card{background:#fff;border:1px solid #e2e7f0;border-radius:15px;padding:17px;margin-bottom:14px;box-shadow:0 5px 20px #18213b08}
h1{font-size:24px;margin:0 0 5px}
h2{font-size:19px;margin:17px 0 9px}
h3{font-size:16px;margin:0 0 8px}
p{color:#657087}
label{display:block;font-size:13px;font-weight:700;color:#526078;margin:11px 0 5px}
input,select,textarea{width:100%;min-width:0;padding:10px 11px;border:1px solid #cbd2df;border-radius:10px;font:inherit;background:#fff;color:#172033}
textarea{min-height:78px;resize:vertical}
input[type=file]{padding:8px}
button{padding:10px 13px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:#5145e5;color:#fff}
.secondary{background:#edf0f7;color:#172033}
.danger{background:#fee2e2;color:#991b1b}
.outline{background:#fff;border:1px solid #d9d5ff;color:#5145e5}
.hidden{display:none!important}
.muted,.small,.help{font-size:13px;color:#657087;overflow-wrap:anywhere}
.status{margin-top:9px;min-height:21px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}
.metric{background:#f7f8fc;padding:12px;border-radius:11px}
.metric strong{display:block;font-size:24px}
.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}
.tab{background:#edf0f7;color:#172033}
.tab.active{background:#5145e5;color:#fff}
.entry{border:1px solid #e2e7f0;border-radius:11px;padding:12px;margin:9px 0;overflow-wrap:anywhere}
.entryhead{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}
.filters,.formgrid,.optiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 11px}
.filters{grid-template-columns:repeat(4,minmax(0,1fr));background:#f8f9fc;border-radius:11px;padding:11px;margin:12px 0}
.full{grid-column:1/-1}
.pill{display:inline-block;background:#eeedff;color:#4034c9;padding:3px 8px;border-radius:30px;font-size:11px}
.draft{background:#fff3cd;color:#765600}
.published{background:#dcfce7;color:#166534}
.notice{background:#fff5d8;color:#694e00;padding:11px;border-radius:10px;font-size:13px;margin:10px 0}
.batchbar{position:sticky;bottom:5px;background:#ffffffed;border:1px solid #e2e7f0;padding:10px;border-radius:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;backdrop-filter:blur(8px);z-index:3}
.progressTrack{height:9px;background:#e8eaf2;border-radius:20px;overflow:hidden;margin-top:8px}
.progressBar{height:100%;width:0;background:#5145e5;transition:width .2s}
.fileMeta{background:#f7f8fc;padding:10px;border-radius:10px;margin-top:9px;overflow-wrap:anywhere}
@media(max-width:680px){
 main{padding:0 9px}
 .card{padding:13px}
 .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
 .filters,.formgrid,.optiongrid,.grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .tab{flex:1 1 38%}
 .batchbar{position:sticky;bottom:4px}
}
</style>
</head>

<body>
<header>
<img src="./commerzo-logo.png" alt="COMMERZO" onerror="this.style.display='none'">
<div>
<strong>COMMERZO ADMIN 2.0</strong>
<div class="small" style="color:#cbd5e1">Learn. Practice. Score.</div>
</div>
</header>

<main>
<section class="card" id="loginPanel">
<h1>Admin Login</h1>
<p>Sign in using your authorized Firebase admin account.</p>
<form id="loginForm">
<label>Email address</label>
<input id="email" type="email" autocomplete="username" required>
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button class="primary" id="loginButton" style="width:100%;margin-top:14px">Sign in</button>
<div id="loginStatus" class="status" role="status"></div>
</form>
<div class="notice">Access requires admins/{uid}.role = "admin".</div>
</section>

<section class="hidden" id="dashboard">
<div class="card entryhead">
<div>
<h1>Dashboard</h1>
<div id="account" class="muted"></div>
</div>
<button class="secondary" id="logoutButton">Sign out</button>
</div>

<div class="card">
<div id="mainStatus" class="status">Checking access…</div>
<div class="grid metrics">
<div class="metric">Subjects<strong id="subjectCount">—</strong></div>
<div class="metric">Chapters<strong id="chapterCount">—</strong></div>
<div class="metric">MCQs<strong id="mcqCount">—</strong></div>
<div class="metric">Resources<strong id="resourceCount">—</strong></div>
</div>

<div class="tabs">
<button class="tab active" data-section="subjects">Subjects</button>
<button class="tab" data-section="chapters">Chapters</button>
<button class="tab" data-section="mcqs">MCQ Studio</button>
<button class="tab" data-section="resources">Resources</button>
</div>

<div class="entryhead">
<div>
<h2 id="sectionTitle">Subjects</h2>
<p id="sectionHelp" class="muted"></p>
</div>
<button class="outline" id="refreshButton">Refresh</button>
</div>

<div id="filters"></div>
<div id="editor"></div>
<div id="contentStatus" class="status" role="status"></div>
<h2 id="listTitle">Saved content</h2>
<div id="entries"></div>
</div>
</section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
 getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
 getFirestore,collection,doc,getDoc,getDocs,addDoc,updateDoc,
 deleteDoc,serverTimestamp,writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyC8UomLked7cPRjfD2yHBBTlCAeCd-53cM",
 authDomain:"commerzo-42fd2.firebaseapp.com",
 projectId:"commerzo-42fd2",
 storageBucket:"commerzo-42fd2.firebasestorage.app",
 messagingSenderId:"472656083923",
 appId:"1:472656083923:web:022b77078ec9e07db00d26",
 measurementId:"G-RCHSTFTQM2"
};

const app=initializeApp(firebaseConfig,"commerzo-admin-2");
const auth=getAuth(app);
const db=getFirestore(app);

const MEDIA_ENDPOINT="https://rawnsqcovqckwreuegpz.supabase.co/functions/v1/super-action";
const MAX_SIZE=20*1024*1024;
const ALLOWED_TYPES=[
 "application/pdf","image/jpeg","image/png","image/webp","video/mp4"
];

const $=id=>document.getElementById(id);

const state={
 user:null,
 section:"subjects",
 subjects:[],
 chapters:[],
 mcqs:[],
 resources:[],
 filters:{board:"MP Board",className:"12",subjectId:"",chapterId:""},
 editing:null,
 batch:[],
 batchSettings:{
  board:"MP Board",className:"12",subjectId:"",chapterId:"",difficulty:"Medium"
 },
 saving:false,
 uploading:false
};

const BOARD_OPTIONS=["MP Board","CBSE","Both"];
const CLASS_OPTIONS=["11","12","Both"];
const DIFFICULTIES=["Easy","Medium","Hard"];

function esc(value){
 return String(value??"").replace(/[&<>"']/g,char=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[char]);
}

function setStatus(id,message,error=false){
 const element=$(id);
 if(!element)return;
 element.textContent=message;
 element.style.color=error?"#b42318":"#167447";
}

function optionList(values,selected){
 return values.map(value=>
  `<option value="${esc(value)}" ${String(value)===String(selected)?"selected":""}>${esc(value)}</option>`
 ).join("");
}

function matchesBoard(item,board){
 const value=String(item.board||"").trim();
 return !value||value==="Both"||value===board;
}

function matchesClass(item,className){
 const value=String(item.className||"").trim().toLowerCase();
 return !value||value==="both"||value===String(className).toLowerCase()||
  value==="11 and 12"||value==="11 & 12";
}

function subjectOptions(board,className,selected=""){
 const subjects=state.subjects.filter(subject=>
  matchesBoard(subject,board)&&matchesClass(subject,className)
 );
 return `<option value="">Select subject</option>`+subjects.map(subject=>
  `<option value="${esc(subject.id)}" ${subject.id===selected?"selected":""}>${esc(subject.name)}</option>`
 ).join("");
}

function chapterOptions(subjectId,board,className,selected=""){
 const chapters=state.chapters.filter(chapter=>
  chapter.subjectId===subjectId&&matchesBoard(chapter,board)&&matchesClass(chapter,className)
 );
 return `<option value="">Select chapter</option>`+chapters.map(chapter=>
  `<option value="${esc(chapter.id)}" ${chapter.id===selected?"selected":""}>${esc(chapter.name)}</option>`
 ).join("");
}

function selectedSubject(){
 return state.subjects.find(subject=>subject.id===state.filters.subjectId);
}
function selectedChapter(){
 return state.chapters.find(chapter=>chapter.id===state.filters.chapterId);
}

function filteredSubjects(){
 return state.subjects.filter(subject=>
  matchesBoard(subject,state.filters.board)&&matchesClass(subject,state.filters.className)
 );
}
function filteredChapters(){
 return state.chapters.filter(chapter=>
  matchesBoard(chapter,state.filters.board)&&matchesClass(chapter,state.filters.className)&&
  (!state.filters.subjectId||chapter.subjectId===state.filters.subjectId)
 );
}
function filteredMcqs(){
 return state.mcqs.filter(mcq=>
  matchesBoard(mcq,state.filters.board)&&matchesClass(mcq,state.filters.className)&&
  (!state.filters.subjectId||mcq.subjectId===state.filters.subjectId)&&
  (!state.filters.chapterId||mcq.chapterId===state.filters.chapterId)
 );
}
function filteredResources(){
 return state.resources.filter(resource=>
  matchesBoard(resource,state.filters.board)&&matchesClass(resource,state.filters.className)&&
  (!state.filters.subjectId||resource.subjectId===state.filters.subjectId)&&
  (!state.filters.chapterId||!resource.chapterId||resource.chapterId===state.filters.chapterId)
 );
}

async function loadAll(){
 setStatus("mainStatus","Loading COMMERZO data…");
 const names=["subjects","chapters","mcqs","resources"];
 const snapshots=await Promise.all(names.map(name=>getDocs(collection(db,name))));
 names.forEach((name,index)=>{
  state[name]=snapshots[index].docs.map(snapshot=>({
   id:snapshot.id,...snapshot.data()
  }));
 });
 $("subjectCount").textContent=state.subjects.length;
 $("chapterCount").textContent=state.chapters.length;
 $("mcqCount").textContent=state.mcqs.length;
 $("resourceCount").textContent=state.resources.length;
 setStatus("mainStatus","COMMERZO data loaded.");
 renderSection();
}

function showDashboard(user){
 state.user=user;
 $("loginPanel").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 $("account").textContent=user.email||user.uid;
 loadAll().catch(error=>{
  console.error(error);
  setStatus("mainStatus","Data loading failed: "+error.message,true);
 });
}

$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=$("loginButton");
 button.disabled=true;
 setStatus("loginStatus","Signing in…");
 try{
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
 }catch(error){
  setStatus("loginStatus",error.message,true);
 }finally{
  button.disabled=false;
 }
});

$("logoutButton").addEventListener("click",async()=>{
 if(confirm("Sign out from COMMERZO Admin?"))await signOut(auth);
});

onAuthStateChanged(auth,async user=>{
 if(!user){
  state.user=null;
  $("dashboard").classList.add("hidden");
  $("loginPanel").classList.remove("hidden");
  return;
 }
 try{
  const adminSnapshot=await getDoc(doc(db,"admins",user.uid));
  if(!adminSnapshot.exists()||adminSnapshot.data().role!=="admin"){
   await signOut(auth);
   setStatus("loginStatus",'This account is not authorized as an admin.',true);
   return;
  }
  showDashboard(user);
 }catch(error){
  console.error(error);
  setStatus("loginStatus","Admin verification failed: "+error.message,true);
 }
});

$("refreshButton").addEventListener("click",()=>{
 loadAll().catch(error=>setStatus("mainStatus",error.message,true));
});

document.querySelectorAll("[data-section]").forEach(button=>{
 button.addEventListener("click",()=>{
  state.section=button.dataset.section;
  state.editing=null;
  renderSection();
 });
});
 function renderSection(){
 document.querySelectorAll("[data-section]").forEach(button=>{
  button.classList.toggle("active",button.dataset.section===state.section);
 });
 const titles={
  subjects:["Subjects","Manage board-wise and class-wise subjects."],
  chapters:["Chapters","Filter chapters by board, class and subject."],
  mcqs:["MCQ Studio","Create and publish MCQs in batches."],
  resources:["Resources","Manage study resources and uploads."]
 };
 $("sectionTitle").textContent=titles[state.section][0];
 $("sectionHelp").textContent=titles[state.section][1];
 renderFilters();
 renderEditor();
 renderEntries();
}

function renderFilters(){
 const box=$("filters");
 if(state.section==="subjects"){
  box.innerHTML=`<div class="filters">
   <div><label>Board</label><select id="filterBoard">${optionList(BOARD_OPTIONS,state.filters.board)}</select></div>
   <div><label>Class</label><select id="filterClass">${optionList(CLASS_OPTIONS,state.filters.className)}</select></div>
  </div>`;
 }else{
  box.innerHTML=`<div class="filters">
   <div><label>Board</label><select id="filterBoard">${optionList(BOARD_OPTIONS,state.filters.board)}</select></div>
   <div><label>Class</label><select id="filterClass">${optionList(CLASS_OPTIONS,state.filters.className)}</select></div>
   <div><label>Subject</label><select id="filterSubject">${subjectOptions(state.filters.board,state.filters.className,state.filters.subjectId)}</select></div>
   ${["chapters","mcqs","resources"].includes(state.section)?`
    <div><label>Chapter</label><select id="filterChapter">${chapterOptions(state.filters.subjectId,state.filters.board,state.filters.className,state.filters.chapterId)}</select></div>
   `:""}
  </div>`;
 }
 $("filterBoard")?.addEventListener("change",event=>{
  state.filters.board=event.target.value;
  resetInvalidFilters();
  renderSection();
 });
 $("filterClass")?.addEventListener("change",event=>{
  state.filters.className=event.target.value;
  resetInvalidFilters();
  renderSection();
 });
 $("filterSubject")?.addEventListener("change",event=>{
  state.filters.subjectId=event.target.value;
  state.filters.chapterId="";
  renderSection();
 });
 $("filterChapter")?.addEventListener("change",event=>{
  state.filters.chapterId=event.target.value;
  renderEntries();
 });
}

function resetInvalidFilters(){
 const validSubjects=filteredSubjects();
 if(!validSubjects.some(subject=>subject.id===state.filters.subjectId)){
  state.filters.subjectId="";
 }
 const validChapters=filteredChapters();
 if(!validChapters.some(chapter=>chapter.id===state.filters.chapterId)){
  state.filters.chapterId="";
 }
}

function renderEditor(){
 const editor=$("editor");
 editor.replaceChildren();
 if(state.section==="subjects")renderSubjectEditor();
 else if(state.section==="chapters")renderChapterEditor();
 else if(state.section==="mcqs")renderMcqEditor();
 else renderResourceEditor();
}

function renderSubjectEditor(){
 $("editor").innerHTML=`<div class="card">
  <h3>${state.editing?.type==="subject"?"Edit subject":"Add subject"}</h3>
  <form id="subjectForm" class="formgrid">
   <div><label>Board</label><select name="board" required>${optionList(BOARD_OPTIONS,state.editing?.data?.board||state.filters.board)}</select></div>
   <div><label>Class</label><select name="className" required>${optionList(CLASS_OPTIONS,state.editing?.data?.className||state.filters.className)}</select></div>
   <div class="full"><label>Subject name</label><input name="name" required maxlength="100" value="${esc(state.editing?.data?.name||"")}"></div>
   <div class="full"><label>Description</label><textarea name="description">${esc(state.editing?.data?.description||"")}</textarea></div>
   <div class="full actions">
    <button class="primary">Save subject</button>
    <button type="button" class="secondary" id="cancelEdit">Cancel</button>
   </div>
  </form>
 </div>`;
 $("subjectForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const form=new FormData(event.currentTarget);
  await saveRecord("subjects",{
   board:form.get("board"),
   className:form.get("className"),
   name:form.get("name").trim(),
   description:form.get("description").trim(),
   updatedAt:serverTimestamp()
  },"subject");
 });
 $("cancelEdit").addEventListener("click",cancelEditing);
}

function renderChapterEditor(){
 const subjectId=state.editing?.type==="chapter"?state.editing.data.subjectId:state.filters.subjectId;
 const board=state.editing?.type==="chapter"?state.editing.data.board:state.filters.board;
 const className=state.editing?.type==="chapter"?state.editing.data.className:state.filters.className;

 $("editor").innerHTML=`<div class="card">
  <h3>${state.editing?.type==="chapter"?"Edit chapter":"Add chapter"}</h3>
  <form id="chapterForm" class="formgrid">
   <div><label>Board</label><select name="board" id="chapterBoard">${optionList(BOARD_OPTIONS,board)}</select></div>
   <div><label>Class</label><select name="className" id="chapterClass">${optionList(CLASS_OPTIONS,className)}</select></div>
   <div class="full"><label>Subject</label><select name="subjectId" id="chapterSubject" required>${subjectOptions(board,className,subjectId)}</select></div>
   <div class="full"><label>Chapter name</label><input name="name" required maxlength="150" value="${esc(state.editing?.data?.name||"")}"></div>
   <div><label>Chapter order</label><input name="order" type="number" min="1" value="${esc(state.editing?.data?.order??"")}"></div>
   <div class="full"><label>Description</label><textarea name="description">${esc(state.editing?.data?.description||"")}</textarea></div>
   <div class="full actions">
    <button class="primary">Save chapter</button>
    <button type="button" class="secondary" id="cancelEdit">Cancel</button>
   </div>
  </form>
 </div>`;

 $("chapterBoard").addEventListener("change",updateChapterSubjects);
 $("chapterClass").addEventListener("change",updateChapterSubjects);
 $("chapterForm").addEventListener("submit",async event=>{
  event.preventDefault();
  const form=new FormData(event.currentTarget);
  const data={
   board:form.get("board"),
   className:form.get("className"),
   subjectId:form.get("subjectId"),
   name:form.get("name").trim(),
   description:form.get("description").trim(),
   order:Number(form.get("order"))||0,
   updatedAt:serverTimestamp()
  };
  if(!data.subjectId){
   setStatus("contentStatus","Select a subject first.",true);
   return;
  }
  await saveRecord("chapters",data,"chapter");
 });
 $("cancelEdit").addEventListener("click",cancelEditing);
}

function updateChapterSubjects(){
 const board=$("chapterBoard").value;
 const className=$("chapterClass").value;
 const previous=$("chapterSubject").value;
 $("chapterSubject").innerHTML=subjectOptions(board,className,previous);
}

async function saveRecord(collectionName,data,type){
 if(state.saving)return;
 state.saving=true;
 setStatus("contentStatus","Saving…");
 try{
  if(state.editing?.type===type){
   await updateDoc(doc(db,collectionName,state.editing.id),data);
  }else{
   data.createdAt=serverTimestamp();
   data.createdBy=state.user?.uid||"";
   await addDoc(collection(db,collectionName),data);
  }
  state.editing=null;
  await loadAll();
  setStatus("contentStatus","Saved successfully.");
 }catch(error){
  console.error(error);
  setStatus("contentStatus",error.message,true);
 }finally{
  state.saving=false;
 }
}

function cancelEditing(){
 state.editing=null;
 renderSection();
}

function editRecord(type,id){
 const collectionName=type==="subject"?"subjects":
  type==="chapter"?"chapters":type==="mcq"?"mcqs":"resources";
 const item=state[collectionName].find(entry=>entry.id===id);
 if(!item)return;
 state.editing={type,id,data:item};
 state.filters.board=item.board||"MP Board";
 state.filters.className=item.className||"12";
 state.filters.subjectId=item.subjectId||"";
 state.filters.chapterId=item.chapterId||"";
 renderSection();
 $("editor").scrollIntoView({behavior:"smooth",block:"start"});
}

async function deleteRecord(collectionName,id){
 if(!confirm("Permanently delete this record? This cannot be undone."))return;
 try{
  await deleteDoc(doc(db,collectionName,id));
  await loadAll();
  setStatus("contentStatus","Record deleted.");
 }catch(error){
  setStatus("contentStatus",error.message,true);
 }
}

function renderEntries(){
 const box=$("entries");
 box.replaceChildren();

 if(state.section==="subjects"){
  const groups=filteredSubjects();
  if(!groups.length){box.textContent="No subjects found.";return;}
  groups.forEach(item=>box.append(makeEntry(
   item.name,`${item.board||"All boards"} · Class ${item.className||"Both"}`,
   "subject",item.id
  )));
 }else if(state.section==="chapters"){
  const groups=filteredChapters();
  const grouped=new Map();
  groups.forEach(chapter=>{
   if(!grouped.has(chapter.subjectId))grouped.set(chapter.subjectId,[]);
   grouped.get(chapter.subjectId).push(chapter);
  });
  grouped.forEach((chapters,subjectId)=>{
   const subject=state.subjects.find(item=>item.id===subjectId);
   const heading=document.createElement("h3");
   heading.textContent=subject?.name||"Subject";
   box.append(heading);
   chapters.sort((a,b)=>Number(a.order||0)-Number(b.order||0)).forEach(item=>{
    box.append(makeEntry(
     item.name,
     `${item.board||"All boards"} · Class ${item.className||"Both"} · Order ${item.order||"—"}`,
     "chapter",item.id
    ));
   });
  });
  if(!groups.length)box.textContent="No chapters found.";
 }else if(state.section==="mcqs"){
  const questions=filteredMcqs();
  const grouped=new Map();
  questions.forEach(question=>{
   const key=question.chapterId||"unassigned";
   if(!grouped.has(key))grouped.set(key,[]);
   grouped.get(key).push(question);
  });
  grouped.forEach((items,chapterId)=>{
   const chapter=state.chapters.find(item=>item.id===chapterId);
   const heading=document.createElement("h3");
   heading.textContent=chapter?.name||"Unassigned chapter";
   box.append(heading);
   items.forEach(item=>{
    const status=item.status||"legacy";
    box.append(makeEntry(
     item.question,
     `${item.board||"—"} · Class ${item.className||"—"} · ${status}`,
     "mcq",item.id,status
    ));
   });
  });
  if(!questions.length)box.textContent="No MCQs found.";
 }else{
  const resources=filteredResources();
  resources.forEach(item=>box.append(makeEntry(
   item.title,
   `${item.type||"Resource"} · ${item.board||"—"} · Class ${item.className||"—"}`,
   "resource",item.id
  )));
  if(!resources.length)box.textContent="No resources found.";
 }
}

function makeEntry(title,description,type,id,status=""){
 const card=document.createElement("div");
 card.className="entry";
 const head=document.createElement("div");
 head.className="entryhead";

 name.textContent=title||"Untitled";

 actions.className="actions";
 if(status){

  badge.className="pill "+(status==="published"?"published":status==="draft"?"draft":"");
  badge.textContent=status;
  actions.append(badge);
 }
 const edit=document.createElement("button");
 edit.className="secondary";
 edit.textContent="Edit";
 edit.addEventListener("click",()=>editRecord(type,id));
 const remove=document.createElement("button");
 remove.className="danger";
 remove.textContent="Delete";
 remove.addEventListener("click",()=>{
  const collectionName=type==="subject"?"subjects":
   type==="chapter"?"chapters":type==="mcq"?"mcqs":"resources";

/* Supabase upload helper.
   The Edge Function must accept Firebase ID tokens and multipart field "file",
   and return {ok:true, storagePath:"..."} on success. */
async function uploadResourceFile(file){
 if(!auth.currentUser)throw new Error("Admin session expired. Sign in again.");
 if(!file)throw new Error("Select a file first.");
 if(file.size<1||file.size>MAX_SIZE)throw new Error("File must be between 1 byte and 20 MiB.");
 if(!ALLOWED_TYPES.includes(file.type))throw new Error("Supported formats: PDF, JPG, PNG, WEBP and MP4.");

 const token=await auth.currentUser.getIdToken(true);
 const form=new FormData();
 form.append("file",file,file.name);

 $("uploadProgress").classList.remove("hidden");
 $("uploadProgressBar").style.width="10%";
 $("uploadProgressText").textContent="Uploading file…";

 const response=await fetch(MEDIA_ENDPOINT,{
  method:"POST",
  headers:{Authorization:"Bearer "+token},
  body:form
 });
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.ok||!result.storagePath){
  throw new Error(result.error||"Upload failed (HTTP "+response.status+").");
 }
 $("uploadProgressBar").style.width="100%";
 $("uploadProgressText").textContent="Upload completed.";
 return result;
 }

   <div class="actions">
    <button class="primary" type="submit">${editing?"Update MCQ":"Save & Add Next"}</button>
    <button class="secondary" type="button" id="clearMcq">Clear fields</button>
   </div>
  </form>
  <div class="small">New questions remain in this batch until saved as drafts or published.</div>
 </div>

 <div class="card">
  <div class="entryhead">
   <div><h3>③ Batch review</h3><div id="batchCount" class="muted">0 questions added</div></div>
   <span class="pill">Review before publishing</span>
  </div>
  <div id="batchPreview"></div>
  <div class="actions">
   <button class="secondary" id="saveDrafts">Save all as drafts</button>
   <button class="primary" id="publishBatch">Publish batch</button>
   <button class="outline" id="clearBatch">Clear batch</button>
  </div>

 function updateBatchSubjects(){
  const board=$("batchBoard").value;
  const className=$("batchClass").value;
  const previous=$("batchSubject").value;
  $("batchSubject").innerHTML=subjectOptions(board,className,previous);
  updateBatchChapters();
 }
 function updateBatchChapters(){
  $("batchChapter").innerHTML=chapterOptions(
   $("batchSubject").value,$("batchBoard").value,$("batchClass").value,""
  );
 }
 function captureSettings(){
  state.batchSettings={
   board:$("batchBoard").value,
   className:$("batchClass").value,
   subjectId:$("batchSubject").value,
   chapterId:$("batchChapter").value,
   difficulty:$("batchDifficulty").value
  };
 }

 $("batchBoard").addEventListener("change",updateBatchSubjects);
 $("batchClass").addEventListener("change",updateBatchSubjects);
 $("batchSubject").addEventListener("change",updateBatchChapters);
 ["batchBoard","batchClass","batchSubject","batchChapter","batchDifficulty"]
  .forEach(id=>$(id).addEventListener("change",captureSettings));

 $("mcqForm").addEventListener("submit",async event=>{
  event.preventDefault();
  captureSettings();
  const current=state.batchSettings;

  if(!current.subjectId||!current.chapterId){
   setStatus("contentStatus","Select a subject and chapter first.",true);
   return;
  }

  const options=[
   $("optionA").value.trim(),$("optionB").value.trim(),
   $("optionC").value.trim(),$("optionD").value.trim()
  ];
  if(options.some(option=>!option)){
   setStatus("contentStatus","Fill all four options.",true);
   return;
  }
  if($("correctAnswer").value===""){
   setStatus("contentStatus","Select the correct answer.",true);
   return;
  }
  const question=$("mcqQuestion").value.trim();
  if(!question){
   setStatus("contentStatus","Enter the question.",true);
   return;
  }

  const itemData={
   question,
   options,
   correctIndex:Number($("correctAnswer").value),
   explanation:$("mcqExplanation").value.trim(),
   board:current.board,
   className:current.className,
   subjectId:current.subjectId,
   chapterId:current.chapterId,
   difficulty:current.difficulty
  };

  if(editing){
   try{
    await updateDoc(doc(db,"mcqs",state.editing.id),{
     ...itemData,
     updatedAt:serverTimestamp()
    });
    state.editing=null;
    await loadAll();
    setStatus("contentStatus","MCQ updated.");
   }catch(error){
    console.error(error);
    setStatus("contentStatus",error.message,true);
   }
   return;
  }

  /* Allocate document ID now. Retries and Draft -> Publish reuse this ID. */
  const reference=doc(collection(db,"mcqs"));
  state.batch.push({
   id:reference.id,
   ...itemData,
   createdAt:serverTimestamp(),
   createdBy:state.user?.uid||""
  });

  $("mcqForm").reset();
  $("mcqQuestion").focus();
  $("batchBoard").value=current.board;
  $("batchClass").value=current.className;
  $("batchSubject").value=current.subjectId;
  $("batchChapter").value=current.chapterId;
  $("batchDifficulty").value=current.difficulty;
  renderBatchPreview();
  setStatus("contentStatus","MCQ added to batch.");
 });

 $("clearMcq").addEventListener("click",()=>{
  $("mcqForm").reset();
  $("mcqQuestion").focus();
 });

 $("saveDrafts").addEventListener("click",saveBatchAsDrafts);
 $("publishBatch").addEventListener("click",publishBatch);
 $("clearBatch").addEventListener("click",()=>{
  if(!state.batch.length)return;
  if(confirm("Clear all unsaved MCQs from this batch?")){
   state.batch=[];
   renderBatchPreview();
  }
 });

 if(editing){
  $("mcqQuestion").value=editing.question||"";
  $("optionA").value=editing.options?.[0]||"";
  $("optionB").value=editing.options?.[1]||"";
  $("optionC").value=editing.options?.[2]||"";
  $("optionD").value=editing.options?.[3]||"";
  $("correctAnswer").value=String(editing.correctIndex??"");
  $("mcqExplanation").value=editing.explanation||"";
 }
 renderBatchPreview();
}

function renderBatchPreview(){
 const box=$("batchPreview");
 if(!box)return;
 box.replaceChildren();
 $("batchCount").textContent=`${state.batch.length} questions added`;
 if(!state.batch.length){
  box.textContent="No questions added yet.";
  return;
 }
 state.batch.forEach((item,index)=>{
  const card=document.createElement("div");
  card.className="entry";
  const title=document.createElement("strong");
  title.textContent=`${index+1}. ${item.question}`;
  const detail=document.createElement("div");
  detail.className="small";
  detail.textContent=`${item.board} · Class ${item.className} · ${item.difficulty}`;
  const answer=document.createElement("p");
  answer.textContent=`Correct answer: ${String.fromCharCode(65+item.correctIndex)}. ${item.options[item.correctIndex]}`;
  const actions=document.createElement("div");
  actions.className="actions";
  const remove=document.createElement("button");
  remove.className="danger";
  remove.textContent="Remove";
  remove.addEventListener("click",()=>{
   state.batch.splice(index,1);
   renderBatchPreview();
  });
  actions.append(remove);
  card.append(title,detail,answer,actions);
  box.append(card);
 });
}

function makeMcqDocument(item,status){
 const data={
  question:item.question,
  subjectId:item.subjectId,
  chapterId:item.chapterId,
  board:item.board,
  className:item.className,
  options:item.options,
  correctIndex:item.correctIndex,
  explanation:item.explanation||"",
  difficulty:item.difficulty||"Medium",
  status,
  updatedAt:serverTimestamp()
 };
 if(item.createdAt)data.createdAt=item.createdAt;
 if(item.createdBy)data.createdBy=item.createdBy;
 return data;
}

async function writeBatchInChunks(items,status){
 const chunkSize=400;
 for(let start=0;start<items.length;start+=chunkSize){
  const chunk=items.slice(start,start+chunkSize);
  const firestoreBatch=writeBatch(db);
  chunk.forEach(item=>{
   const reference=doc(db,"mcqs",item.id);
   firestoreBatch.set(reference,makeMcqDocument(item,status),{merge:true});
  });
  await firestoreBatch.commit();
 }
}

async function saveBatchAsDrafts(){
 if(!state.batch.length||state.saving)return;
 if(!confirm(`Save ${state.batch.length} MCQs as drafts?`))return;
 state.saving=true;
 setStatus("contentStatus","Saving draft batch…");
 try{
  await writeBatchInChunks(state.batch,"draft");
  state.batch=[];
  await loadAll();
  setStatus("contentStatus","Drafts saved successfully.");
 }catch(error){
  console.error(error);
  setStatus("contentStatus","Draft save failed. Your batch is retained; retry is safe. "+error.message,true);
 }finally{
  state.saving=false;
 }
}

async function publishBatch(){
 if(!state.batch.length||state.saving)return;
 if(!confirm(`Publish ${state.batch.length} MCQs? Students may see them after the homepage update.`))return;
 state.saving=true;
 setStatus("contentStatus","Publishing batch…");
 try{
  await writeBatchInChunks(state.batch,"published");
  state.batch=[];
  await loadAll();
  setStatus("contentStatus","MCQs published successfully.");
 }catch(error){
  console.error(error);
  setStatus("contentStatus","Publish failed. Your batch is retained; retry is safe. "+error.message,true);
 }finally{
  state.saving=false;
 }
}

function renderResourceEditor(){
 const editing=state.editing?.type==="resource"?state.editing.data:null;
 $("editor").innerHTML=`
 <div class="card">
  <h3>${editing?"Edit resource":"Add resource"}</h3>
  <form id="resourceForm">
   <div class="formgrid">
    <div><label>Board</label><select name="board">${optionList(BOARD_OPTIONS,editing?.board||state.filters.board)}</select></div>
    <div><label>Class</label><select name="className">${optionList(CLASS_OPTIONS,editing?.className||state.filters.className)}</select></div>
    <div class="full"><label>Subject</label><select name="subjectId" id="resourceSubject">${subjectOptions(editing?.board||state.filters.board,editing?.className||state.filters.className,editing?.subjectId||state.filters.subjectId)}</select></div>
    <div class="full"><label>Chapter (optional)</label><select name="chapterId" id="resourceChapter">${chapterOptions(editing?.subjectId||state.filters.subjectId,editing?.board||state.filters.board,editing?.className||state.filters.className,editing?.chapterId||"")}</select></div>
    <div><label>Resource type</label><select name="type">${optionList(["Handwritten Notes","Previous Year Papers","Marking Scheme","Sample Papers","Important Questions","Syllabus","Other"],editing?.type||"Handwritten Notes")}</select></div>
    <div><label>Access</label><select name="access">${optionList(["public","login"],editing?.access||"public")}</select></div>
    <div class="full"><label>Title</label><input name="title" required value="${esc(editing?.title||"")}"></div>
    <div class="full"><label>Description</label><textarea name="description">${esc(editing?.description||"")}</textarea></div>
    <div class="full"><label>Resource URL (optional)</label><input name="url" type="url" value="${esc(editing?.url||"")}" placeholder="https://example.com/resource.pdf"></div>
    <div class="full">
     <label>Upload file (PDF, JPG, PNG, WEBP, MP4 — max 20 MB)</label>
     <input id="resourceFile" name="resourceFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.mp4,application/pdf,image/jpeg,image/png,image/webp,video/mp4">
     <div class="help">If you do not select a new file while editing, the existing uploaded file metadata will be retained.</div>
     <div id="existingFile" class="${editing?.storagePath?"fileMeta":"hidden"}">
      <strong>Existing uploaded file</strong>
      <div class="small">${esc(editing?.fileName||editing?.storagePath||"File attached")}</div>
      <div class="small">${esc(editing?.fileType||"")} ${editing?.fileSize? "· "+Math.round(Number(editing.fileSize)/1024)+" KB":""}</div>
     </div>
     <div id="uploadProgress" class="hidden">
      <div id="uploadProgressText" class="small">Waiting…</div>
      <div class="progressTrack"><div id="uploadProgressBar" class="progressBar"></div></div>
     </div>
    </div>
   </div>
   <div class="notice">Uploaded files are stored through the COMMERZO Supabase Edge Function. A private storage path is saved in Firestore; this admin does not delete old storage files automatically.</div>
   <div class="actions">
    <button class="primary" id="saveResourceButton">Save resource</button>
    <button type="button" class="secondary" id="cancelResource">Cancel</button>
   </div>
  </form>
 </div>`;

 const form=$("resourceForm");
 form.querySelector('[name="board"]').addEventListener("change",updateResourceSubjects);
 form.querySelector('[name="className"]').addEventListener("change",updateResourceSubjects);
 $("resourceSubject").addEventListener("change",updateResourceChapters);

 form.addEventListener("submit",async event=>{
  event.preventDefault();
  if(state.saving||state.uploading)return;

  const values=new FormData(form);
  const url=String(values.get("url")||"").trim();
  if(url&&!/^https?:\/\//i.test(url)){
   setStatus("contentStatus","Enter a valid HTTP or HTTPS URL.",true);
   return;
  }

  const file=$("resourceFile").files[0]||null;
  if(file){
   if(file.size<1||file.size>MAX_SIZE){
    setStatus("contentStatus","File must be between 1 byte and 20 MiB.",true);
    return;
   }
   if(!ALLOWED_TYPES.includes(file.type)){
    setStatus("contentStatus","Supported formats: PDF, JPG, PNG, WEBP and MP4.",true);
    return;
   }
  }

  const data={
   board:values.get("board"),
   className:values.get("className"),
   subjectId:values.get("subjectId")||"",
   chapterId:values.get("chapterId")||"",
   type:values.get("type"),
   access:values.get("access"),
   title:String(values.get("title")||"").trim(),
   description:String(values.get("description")||"").trim(),
   url,
   updatedAt:serverTimestamp()
  };

  if(!data.title){
   setStatus("contentStatus","Enter a resource title.",true);
   return;
  }

  /* Preserve all existing file metadata unless a new upload succeeds. */
  if(editing){
   [
    "storagePath","storageProvider","fileName","fileType","fileSize",
    "uploadedBy","uploadedAt"
   ].forEach(key=>{
    if(editing[key]!==undefined)data[key]=editing[key];
   });
  }

  const saveButton=$("saveResourceButton");
  saveButton.disabled=true;
  state.saving=true;

  try{
   if(file){
    state.uploading=true;
    setStatus("contentStatus","Uploading resource file…");
    const result=await uploadResourceFile(file);

    data.storagePath=result.storagePath;
    data.storageProvider="supabase";
    data.fileName=result.fileName||file.name;
    data.fileType=result.fileType||file.type;
    data.fileSize=result.fileSize||file.size;
    data.uploadedBy=result.uploadedBy||state.user?.uid||"";
    data.uploadedAt=serverTimestamp();
   }

   if(editing){
    await updateDoc(doc(db,"resources",state.editing.id),data);
   }else{
    data.createdAt=serverTimestamp();
    data.createdBy=state.user?.uid||"";
    await addDoc(collection(db,"resources"),data);
   }

   state.editing=null;
   await loadAll();
   setStatus("contentStatus",file?"Resource saved and file uploaded successfully.":"Resource saved successfully.");
  }catch(error){
   console.error(error);
   setStatus("contentStatus","Resource was not saved: "+error.message,true);
  }finally{
   state.saving=false;
   state.uploading=false;
   if($("saveResourceButton"))$("saveResourceButton").disabled=false;
  }
 });

 $("cancelResource").addEventListener("click",cancelEditing);
}

 );
}
